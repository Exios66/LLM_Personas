project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - Getstarted.md
    - site/apps/index.md
    - site/guide/*.md
    - site/core/*.md
    - site/courtroom/*.md
    - site/courtroom/transcripts/*.md
    - site/litigation/*.md
    - site/executive/*.md
    - site/project/*.md
  resources:
    - site/apps/live-courtroom/**
    - site/apps/portal/**

website:
  title: "MORNINGSTAR"
  site-url: https://connect.posit.cloud/jackjburleson/content/019f9a59-7b27-9a28-b0e8-d4576d860993
  description: "The MORNINGSTAR Operational Agent Swarm — deliberative AI courtroom framework"
  repo-url: https://github.com/Exios66/LLM_Personas
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    background: "#1e1f29"
    foreground: "#f8f8f2"
    left:
      - href: index.qmd
        text: Overview
      - href: Getstarted.md
        text: Get Started
      - text: Guide
        menu:
          - href: site/guide/quick-start.md
            text: Quick Start
          - href: site/guide/the-court.md
            text: The Court
          - href: site/guide/command-reference.md
            text: Commands
          - href: site/guide/procedures.md
            text: Procedures
          - href: site/guide/when-to-convene.md
            text: When to Convene
          - href: site/guide/domains-and-experts.md
            text: Domains & Experts
          - href: site/guide/companion-personas.md
            text: Companion Personas
          - href: site/guide/glossary.md
            text: Glossary
      - text: Framework
        menu:
          - href: site/core/personalities.md
            text: Personalities
          - href: site/core/mfaf.md
            text: MFAF (F0–F5)
          - href: site/core/sme-framework.md
            text: SME Framework
          - href: site/courtroom/rules.md
            text: Court Rules
          - href: site/courtroom/precedents.md
            text: Precedents
          - href: site/courtroom/transcripts.md
            text: Transcripts
          - href: site/litigation/runner.md
