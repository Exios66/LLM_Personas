    left: "MORNINGSTAR · LLM_Personas · Jack J. Burleson"
    right:
      - text: "Built with Quarto"
      - icon: github
        href: https://github.com/Exios66/LLM_Personas
        aria-label: GitHub repository
  sidebar:
    style: "floating"
    contents:
      - section: "Start here"
        contents:
          - index.qmd
          - Getstarted.md
          - site/apps/index.md
          - site/guide/quick-start.md
