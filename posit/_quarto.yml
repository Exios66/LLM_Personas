format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    toc-location: right
    number-sections: false
    code-fold: true
    code-tools: false
    link-external-newwindow: true
    smooth-scroll: true
    citations-hover: true
    footnotes-hover: true

execute:
  echo: true
  warning: false
  message: false
  freeze: auto
