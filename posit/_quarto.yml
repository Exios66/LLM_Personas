          - href: site/executive/protocol.md
            text: Executive Protocol
      - text: Apps
        menu:
          - href: site/apps/index.md
            text: Applications
          - href: site/apps/live-courtroom/index.html
            text: Live Courtroom
          - href: site/apps/portal/viewer.html
            text: Transcript Portal
      - text: Project
        menu:
          - href: site/project/modelcard.md
            text: Model Card
          - href: site/project/metrics.md
            text: Metrics
          - href: site/project/architecture.md
            text: Architecture
          - href: site/project/changelog.md
            text: Changelog
          - href: site/project/security.md
            text: Security
          - href: site/guide/repository-map.md
            text: Repository Map
    right:
      - icon: github
        href: https://github.com/Exios66/LLM_Personas
        aria-label: GitHub repository Exios66/LLM_Personas
      - icon: github
        href: https://github.com/Exios66
        text: Exios66
        aria-label: GitHub profile Exios66
